{% macro icon(name) -%}
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'display' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--surface)"/><circle cx="15" cy="17" r="3" fill="var(--surface)"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'pin' %}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>
{% elif name == 'moon' %}<path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'refresh' %}<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'arrow-up' %}<path d="M12 19V5m-6 6 6-6 6 6"/>
{% elif name == 'arrow-down' %}<path d="M12 5v14m-6-6 6 6 6-6"/>
{% elif name == 'arrow-right' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'grip' %}<circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/>
{% endif %}
</svg>
{%- endmacro %}
